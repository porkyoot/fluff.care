# =============================================================================
# Taskfile.cloudflare.yml — Cloudflare Addon Tasks (addon:cloudflare)
# Tools: wrangler, cloudflared, D1/R2/Workers AST rules
# Managed by polyglot-guardrails (DO NOT EDIT MANUALLY)
# =============================================================================
version: '3'

tasks:
  types:
    desc: "Generate Cloudflare Worker runtime bindings types via wrangler types"
    cmds:
      - |
        if [ -f wrangler.toml ] && command -v wrangler >/dev/null 2>&1; then
          wrangler types
        fi

  lint:
    desc: "Validate wrangler.toml configuration and Cloudflare bindings"
    cmds:
      - bash ./.guardrails/scripts/validate-wrangler.sh

  sec:
    desc: "Verify Cloudflare Workers/Pages/D1/R2 security rules"
    cmds:
      - bash ./.guardrails/scripts/validate-wrangler.sh
      - |
        if grep -RInE \
          --exclude-dir=.git \
          --exclude-dir=node_modules \
          --exclude-dir=dist \
          --exclude-dir=build \
          --exclude-dir=coverage \
          --exclude-dir=.guardrails \
          '\.prepare\s*\(\s*`[^`]*\$\{[^}]+\}[^`]*`\s*\)' . ; then
          echo "[addon:cloudflare ERROR] Raw SQL interpolation in D1 .prepare() detected! Use .bind() parameters." >&2
          exit 1
        fi
        echo "[addon:cloudflare] Verified Workers/Pages/D1/R2 security guardrails."
