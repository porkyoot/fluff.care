# =============================================================================
# testing-fortress.yml — Cross-Language Lock 6 Test Assertion Purity AST Rules
# Bans skipped/focused tests, weak matchers, and tautological assertions
# across TypeScript, Python, Java, and Kotlin.
# Managed by polyglot-guardrails (DO NOT EDIT MANUALLY)
# =============================================================================
rules:
  - id: testing-fortress-no-ts-skipped-or-focused-tests
    patterns:
      - pattern-either:
          - pattern: it.skip(...)
          - pattern: test.skip(...)
          - pattern: describe.skip(...)
          - pattern: it.only(...)
          - pattern: test.only(...)
          - pattern: describe.only(...)
    message: >
      [LOCK 6 TESTING FORTRESS] Skipped (.skip) and focused (.only) tests are
      strictly forbidden. Fix or delete broken tests before committing.
    languages: [typescript, js]
    severity: ERROR

  - id: testing-fortress-no-ts-weak-assertions-or-mocks
    patterns:
      - pattern-either:
          - pattern: expect($X).toBeTruthy()
          - pattern: expect($X).toBeFalsy()
          - pattern: expect($X).toMatchSnapshot()
          - pattern: vi.mock(...)
          - pattern: jest.mock(...)
    message: >
      [LOCK 6 TESTING FORTRESS] Weak matchers (toBeTruthy, toBeFalsy,
      toMatchSnapshot) and module mocks (vi.mock, jest.mock) are forbidden.
      Assert exact values and inject explicit dependencies.
    languages: [typescript, js]
    severity: ERROR

  - id: testing-fortress-no-python-skipped-or-tautological-tests
    patterns:
      - pattern-either:
          - pattern: pytest.skip(...)
          - pattern: unittest.skip(...)
          - pattern: assert True
          - pattern: self.assertTrue(True)
    message: >
      [LOCK 6 TESTING FORTRESS] Skipped tests (pytest.skip, unittest.skip) and
      tautological assertions (assert True) are forbidden in test suites.
    languages: [python]
    severity: ERROR

  - id: testing-fortress-no-jvm-disabled-or-tautological-tests
    patterns:
      - pattern-either:
          - pattern: assertTrue(true)
          - pattern: assertFalse(false)
          - pattern: Assertions.assertTrue(true)
    message: >
      [LOCK 6 TESTING FORTRESS] Tautological assertions (assertTrue(true),
      assertFalse(false)) are forbidden in JVM test suites.
    languages: [java, kotlin]
    severity: ERROR
