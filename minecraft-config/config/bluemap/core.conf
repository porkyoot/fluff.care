##                          ##
##         BlueMap          ##
##       Core-Config        ##
##                          ##

# EULA accepted for downloading Mojang client resources needed to render 3D map models
accept-download: true

# The folder where BlueMap saves data files it needs during runtime.
data: "bluemap"

# Number of threads BlueMap will use to render the maps (-2 leaves 2 cores free for the server)
render-thread-count: -2

# Cooldown time in seconds for updating region-files.
update-cooldown: 60

# The interval in minutes at which a full map update will be triggered.
full-update-interval: 1440

# The interval in minutes at which BlueMap checks all region-files for changes.
region-file-check-interval: 5

# Controls whether BlueMap should try to find and load mod resources and datapacks from the server/world directories.
scan-for-mod-resources: true

# Basic anonymous usage metrics
metrics: true

log: {
  file: "bluemap/debug.log"
  append: false
}

