##                          ##
##         BlueMap          ##
##     Webserver-Config     ##
##                          ##

# Enable the integrated BlueMap webserver
enabled: true

# The webroot that the server will host to the web.
webroot: "bluemap/web"

# The port that the webserver listens to (configured for map.fluff.care proxy).
port: 25969

# Whether to use Server-Sent Events (SSE) for pushing tile and marker-updates to the connected clients.
sse-enabled: true

additional-headers: {
  "Cache-Control": "public, max-age=86400, stale-if-error=604800"
  "CDN-Cache-Control": "max-age=60"
  "Access-Control-Allow-Origin": "*"
}

log: {
  #file: "bluemap/webserver.log"
  append: false
  format: "%1$s \"%3$s %4$s %5$s\" %6$s %7$s"
}

